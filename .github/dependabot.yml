# Weekly update pull requests; CI tests each one before you merge it.
# cooldown: only versions released at least 14 days ago are proposed (security fixes
# are not delayed). Minor and patch updates are grouped into one pull request.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Major versions that need a planned upgrade rather than a weekly pull request:
    # - typescript: the lint and type-check tools must support the new version first.
    # - @types/node: must match the Node version the app runs on (the images and CI).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Base images in docker/Dockerfile.dev and docker/Dockerfile.prod.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # A new Node major version is upgraded on purpose, together with CI (setup-node)
    # and @types/node; only updates within the current major arrive automatically.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
